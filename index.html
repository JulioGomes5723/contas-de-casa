<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Contas da Casa</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #fff;
        --tx: #1c2430;
        --mut: #6b7686;
        --bd: #e2e6ec;
        --ac: #2563eb;
        --ok: #16a34a;
        --bad: #dc2626;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #12161c;
          --card: #1b222b;
          --tx: #e8edf3;
          --mut: #9aa6b5;
          --bd: #2b3541;
          --ac: #5b8def;
          --ok: #4ade80;
          --bad: #f87171;
        }
      }
      :root[data-theme="dark"] {
        --bg: #12161c;
        --card: #1b222b;
        --tx: #e8edf3;
        --mut: #9aa6b5;
        --bd: #2b3541;
        --ac: #5b8def;
        --ok: #4ade80;
        --bad: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 8px 0 14px;
      }
      .sum {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
      }
      .box {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
      }
      .box small {
        color: var(--mut);
        display: block;
      }
      .box b {
        font-size: 1.15rem;
      }
      .pend b {
        color: var(--bad);
      }
      .paid b {
        color: var(--ok);
      }
      form {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--bd);
        background: var(--bg);
        color: var(--tx);
        font-size: 1rem;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 0;
        padding: 10px 12px;
      }
      .add {
        background: var(--ac);
        color: #fff;
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tabs button {
        flex: 1;
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      .tabs button.on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .item {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .info b {
        display: block;
        overflow-wrap: anywhere;
      }
      .info small {
        color: var(--mut);
      }
      .late {
        color: var(--bad) !important;
      }
      .val {
        font-weight: 600;
        white-space: nowrap;
      }
      .act {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pay {
        background: var(--ok);
        color: #fff;
        padding: 6px 10px;
      }
      .undo {
        background: var(--bd);
        color: var(--tx);
        padding: 6px 10px;
      }
      .del {
        background: transparent;
        color: var(--bad);
        padding: 4px 10px;
      }
      .st {
        font-size: 0.85rem;
        color: var(--mut);
        margin: -6px 0 12px;
      }
      .st.bad {
        color: var(--bad);
      }
      .empty {
        text-align: center;
        color: var(--mut);
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Contas da Casa</h1>
      <div id="st" class="st"></div>
      <div class="sum">
        <div class="box pend"><small>A pagar</small><b id="tp">R$ 0,00</b></div>
        <div class="box paid">
          <small>Já pagas</small><b id="tg">R$ 0,00</b>
        </div>
      </div>
      <form id="f">
        <input id="n" placeholder="Nome da conta (ex.: Luz)" required />
        <div class="row2">
          <input
            id="v"
            type="number"
            step="0.01"
            min="0"
            placeholder="Valor (R$)"
            required
          />
          <input id="d" type="date" required />
        </div>
        <small style="color: var(--mut)">Mês e ano da conta</small>
        <input id="m" type="month" placeholder="AAAA-MM" required />
        <button class="add" type="submit">Adicionar conta</button>
      </form>
      <select id="fm" style="margin-bottom: 10px"></select>
      <div class="tabs">
        <button id="t0" class="on">Não pagas</button>
        <button id="t1">Pagas</button>
      </div>
      <div id="list"></div>
    </main>
    <script>
      var bills = [],
        tab = 0,
        col = null,
        loaded = false,
        fm = "";
      var MESES = [
        "Janeiro",
        "Fevereiro",
        "Março",
        "Abril",
        "Maio",
        "Junho",
        "Julho",
        "Agosto",
        "Setembro",
        "Outubro",
        "Novembro",
        "Dezembro",
      ];
      function ml(m) {
        if (!m) return "Sem mês";
        var p = m.split("-");
        return MESES[+p[1] - 1] + " de " + p[0];
      }
      function fillMonths() {
        var s = document.getElementById("fm");
        var ms = [];
        bills.forEach(function (b) {
          if (ms.indexOf(b.m) < 0) ms.push(b.m);
        });
        ms.sort().reverse();
        var key = ms.join("|");
        if (s.dataset.k === key) return;
        s.dataset.k = key;
        s.innerHTML = "";
        var o = document.createElement("option");
        o.value = "";
        o.textContent = "Todos os meses";
        s.appendChild(o);
        ms.forEach(function (m) {
          var o = document.createElement("option");
          o.value = m;
          o.textContent = ml(m);
          s.appendChild(o);
        });
        s.value = ms.indexOf(fm) < 0 ? "" : fm;
        fm = s.value;
      }
      function brl(x) {
        return x.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }
      function fd(s) {
        var p = s.split("-");
        return p[2] + "/" + p[1] + "/" + p[0];
      }
      function setSt(t, bad) {
        var e = document.getElementById("st");
        e.textContent = t;
        e.className = bad ? "st bad" : "st";
      }
      function render() {
        var tp = 0,
          tg = 0,
          today = new Date().toISOString().slice(0, 10);
        fillMonths();
        var vis = bills.filter(function (b) {
          return !fm || b.m === fm;
        });
        vis.forEach(function (b) {
          if (b.paid) tg += b.v;
          else tp += b.v;
        });
        document.getElementById("tp").textContent = brl(tp);
        document.getElementById("tg").textContent = brl(tg);
        document.getElementById("t0").className = tab === 0 ? "on" : "";
        document.getElementById("t1").className = tab === 1 ? "on" : "";
        var items = vis
          .filter(function (b) {
            return b.paid === (tab === 1);
          })
          .sort(function (a, b) {
            return a.d < b.d ? -1 : 1;
          });
        var el = document.getElementById("list");
        el.innerHTML = "";
        if (!items.length) {
          el.innerHTML = '<div class="empty">Nenhuma conta aqui.</div>';
          return;
        }
        items.forEach(function (b) {
          var late = !b.paid && b.d < today;
          var div = document.createElement("div");
          div.className = "item";
          var info = document.createElement("div");
          info.className = "info";
          var nm = document.createElement("b");
          nm.textContent = b.n;
          var sm = document.createElement("small");
          sm.textContent =
            ml(b.m) + " · vence em " + fd(b.d) + (late ? " · atrasada" : "");
          if (late) sm.className = "late";
          info.appendChild(nm);
          info.appendChild(sm);
          var val = document.createElement("div");
          val.className = "val";
          val.textContent = brl(b.v);
          var act = document.createElement("div");
          act.className = "act";
          var m = document.createElement("button");
          m.className = b.paid ? "undo" : "pay";
          m.textContent = b.paid ? "Desfazer" : "Paguei";
          m.onclick = function () {
            col
              .doc(b.id)
              .update({ paid: !b.paid })
              .catch(function () {
                setSt("Não consegui salvar. Tente de novo.", 1);
              });
          };
          var x = document.createElement("button");
          x.className = "del";
          x.textContent = "Excluir";
          x.onclick = function () {
            if (confirm("Excluir esta conta?")) {
              col
                .doc(b.id)
                .delete()
                .catch(function () {
                  setSt("Não consegui excluir. Tente de novo.", 1);
                });
            }
          };
          act.appendChild(m);
          act.appendChild(x);
          div.appendChild(info);
          div.appendChild(val);
          div.appendChild(act);
          el.appendChild(div);
        });
      }
      document.getElementById("f").onsubmit = function (e) {
        e.preventDefault();
        if (!col) {
          setSt("Nuvem indisponível: não dá para salvar agora.", 1);
          return;
        }
        var f = this;
        col
          .add({
            n: document.getElementById("n").value.trim(),
            v: parseFloat(document.getElementById("v").value) || 0,
            d: document.getElementById("d").value,
            m: document.getElementById("m").value,
            paid: false,
          })
          .then(function () {
            f.reset();
            document.getElementById("m").value = new Date()
              .toISOString()
              .slice(0, 7);
            fm = "";
            tab = 0;
            render();
          })
          .catch(function () {
            setSt("Não consegui salvar. Tente de novo.", 1);
          });
      };
      document.getElementById("t0").onclick = function () {
        tab = 0;
        render();
      };
      document.getElementById("t1").onclick = function () {
        tab = 1;
        render();
      };
      render();
      document.getElementById("m").value = new Date().toISOString().slice(0, 7);
      document.getElementById("fm").onchange = function () {
        fm = this.value;
        render();
      };
      setSt("Conectando à nuvem...");
      var timer = setTimeout(function () {
        if (!loaded)
          setSt(
            "Ainda não consegui acessar a nuvem. Os dados podem estar desatualizados.",
            1,
          );
      }, 10000);
      (function () {
        var KEY = "contas-casa-v2",
          store = [];
        try {
          store = JSON.parse(localStorage.getItem(KEY) || "[]");
        } catch (e) {}
        function commit() {
          try {
            localStorage.setItem(KEY, JSON.stringify(store));
          } catch (e) {
            setSt("Não consegui salvar neste navegador.", 1);
          }
          bills = store.slice();
          render();
        }
        col = {
          add: function (o) {
            o.id = String(Date.now()) + Math.random().toString(36).slice(2, 6);
            store.push(o);
            commit();
            return Promise.resolve();
          },
          doc: function (id) {
            return {
              update: function (p) {
                store.forEach(function (b) {
                  if (b.id === id) Object.assign(b, p);
                });
                commit();
                return Promise.resolve();
              },
              delete: function () {
                store = store.filter(function (b) {
                  return b.id !== id;
                });
                commit();
                return Promise.resolve();
              },
            };
          },
        };
        clearTimeout(timer);
        loaded = true;
        bills = store.slice();
        setSt("Salvo neste computador (no navegador)");
        render();
      })();
    </script>
  </body>
</html>
